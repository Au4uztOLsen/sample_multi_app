services:
  web:
    build: ./web
    image: sample_multi_app:v1.0
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      APP_ENV: local
      APP_VERSION: v1.0
    depends_on:
      - mongodb
    networks:
      - micro_app-net

  mongodb:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    networks:
      - micro_app-net

networks:
  micro_app-net:

volumes:
  mongo-data:
