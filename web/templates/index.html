<!doctype html>
<html>
  <head>
    <title>IP Logger</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <h1>Hello, your IP is {{ ip }}</h1>
    <p>You have visited {{ count }} times.</p>

    <hr />

    <p>Environment: {{ app_env }}</p>
    <p>Version: {{ app_version }}</p>
    <p>Container/Pod: {{ hostname }}</p>
  </body>
</html>
